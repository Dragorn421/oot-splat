build_system = "make"
compiler_type = "ido"

[preserve_macros]
"NULL" = "void*"
"ABS" = "int"
"MIN" = "int"
"MAX" = "int"
"CLAMP_MIN" = "int"
"CLAMP_MAX" = "int"
"CLAMP" = "int"
"IO_READ" = "unsigned long"
"IO_WRITE" = "void"

[decompme.compilers]
"*/tools/ido_recomp/linux/5.3/cc" = "ido5.3"
"*/tools/ido_recomp/linux/7.1/cc" = "ido7.1"
